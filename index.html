<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Task Tracker & Report Generator (Supabase)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS CDN (สำหรับ Export Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">IT Task Tracker & Report</h1>
        <p class="text-slate-500 text-sm">ระบบบันทึกงาน IT ประจำวัน และออกรายงานตามช่วงเวลา (Supabase Sync)</p>
      </div>
      <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-lg text-sm flex items-center justify-center gap-2 shadow-sm transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Export Excel Report (ตามรายการที่แสดง)
      </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Form เพิ่ม Task -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-semibold mb-4 text-slate-900">บันทึกงานใหม่</h2>
        <form id="taskForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ Task / งานที่ทำ</label>
            <input type="text" id="title" required placeholder="เช่น รีเซ็ต Password / แก้ไขปัญหาระบบ" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">ผู้แจ้งงาน / แผนก</label>
              <input type="text" id="reporter" placeholder="เช่น FO, คุณสมชาย" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">ผู้รับงาน / ดำเนินการ</label>
              <input type="text" id="assignee" placeholder="เช่น Supatcha" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">หมวดหมู่งาน (Category)</label>
            <select id="category" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <optgroup label="System & Software">
                <option value="POS">POS</option>
                <option value="PC/ Laptop">PC/ Laptop</option>
                <option value="Opera V.5">Opera V.5</option>
                <option value="Opera Cloud">Opera Cloud</option>
                <option value="MC">MC</option>
                <option value="MC/2">MC/2</option>
                <option value="SUN">SUN</option>
                <option value="SUN/2">SUN/2</option>
                <option value="Passport">Passport</option>
              </optgroup>
              <optgroup label="Hardware & Access">
                <option value="Door">Door</option>
                <option value="Door/2">Door/2</option>
                <option value="CCTV">CCTV</option>
                <option value="Print">Print</option>
              </optgroup>
              <optgroup label="Network & Communication">
                <option value="Wi-Fi">Wi-Fi</option>
                <option value="Wi-Fi/2">Wi-Fi/2</option>
                <option value="TV">TV</option>
                <option value="Phone">Phone</option>
                <option value="Phone/2">Phone/2</option>
              </optgroup>
              <optgroup label="General & Others">
                <option value="General work">General work</option>
                <option value="other">other</option>
              </optgroup>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ระดับความสำคัญ</label>
            <select id="priority" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Normal">Normal</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">รายละเอียดเพิ่มเติม / ผลลัพธ์</label>
            <textarea id="description" rows="3" placeholder="ระบุการแก้ไขหรือหมายเหตุ..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm shadow-sm transition-all">บันทึก Task</button>
        </form>
      </div>

      <!-- รายการ Task Log & Filter -->
      <div class="lg:col-span-2 space-y-4">
        
        <!-- Filter Box -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-end gap-3 text-sm">
          <div class="flex-1 min-w-[140px]">
            <label class="block text-xs font-medium text-slate-600 mb-1">ตั้งแต่วันที่</label>
            <input type="date" id="startDate" class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex-1 min-w-[140px]">
            <label class="block text-xs font-medium text-slate-600 mb-1">ถึงวันที่</label>
            <input type="date" id="endDate" class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex gap-2">
            <button onclick="fetchTasks()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-xs font-medium transition-all">กรองข้อมูล</button>
            <button onclick="resetFilter()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition-all">ล้างการกรอง</button>
          </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold text-slate-900">รายการงานทั้งหมด</h2>
            <span id="taskCount" class="bg-blue-50 text-blue-700 font-semibold text-xs px-2.5 py-1 rounded-full">กำลังโหลด...</span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
              <thead class="bg-slate-50 text-slate-700 border-b border-slate-200">
                <tr>
                  <th class="p-3">วันที่</th>
                  <th class="p-3">งานที่ทำ</th>
                  <th class="p-3">ผู้แจ้ง / ผู้รับงาน</th>
                  <th class="p-3">Category</th>
                  <th class="p-3">ความสำคัญ</th>
                  <th class="p-3">การจัดการ</th>
                </tr>
              </thead>
              <tbody id="taskTableBody" class="divide-y divide-slate-100">
                <!-- ข้อมูลจาก Supabase จะแสดงที่นี่ -->
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mpvyalurrgrymbvbmwcj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2sxnepbtIji-OK0ddOnQFA_cCin-yLu';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentTasks = [];

    // 1. ดึงข้อมูลจาก Supabase พร้อมระบบกรองวันที่
    async function fetchTasks() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      let query = supabaseClient
        .from('tasks')
        .select('*')
        .order('id', { ascending: false });

      if (startDate) {
        query = query.gte('date', startDate);
      }
      if (endDate) {
        query = query.lte('date', endDate);
      }

      const { data, error } = await query;

      if (error) {
        console.error('Error fetching tasks:', error);
        document.getElementById('taskCount').innerText = `Error!`;
        return;
      }

      currentTasks = data || [];
      renderTable();
    }

    function resetFilter() {
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      fetchTasks();
    }

    function renderTable() {
      const tbody = document.getElementById('taskTableBody');
      tbody.innerHTML = '';
      document.getElementById('taskCount').innerText = `${currentTasks.length} รายการ`;

      if (currentTasks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">ไม่พบข้อมูล Task ช่วงเวลานี้</td></tr>`;
        return;
      }

      currentTasks.forEach((task) => {
        const priorityBadge = task.priority === 'High' || task.priority === 'Urgent' 
          ? 'bg-rose-50 text-rose-600 border-rose-200' 
          : 'bg-slate-50 text-slate-600 border-slate-200';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 whitespace-nowrap text-slate-500">${task.date}</td>
            <td class="p-3 font-medium text-slate-900">${task.title}<br><span class="text-xs text-slate-400 font-normal">${task.description || '-'}</span></td>
            <td class="p-3 whitespace-nowrap text-xs">
              <span class="text-slate-700 font-medium">แจ้ง:</span> ${task.reporter || '-'}<br>
              <span class="text-slate-700 font-medium">รับ:</span> ${task.assignee || '-'}
            </td>
            <td class="p-3 whitespace-nowrap"><span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-semibold">${task.category}</span></td>
            <td class="p-3 whitespace-nowrap"><span class="border ${priorityBadge} px-2 py-0.5 rounded text-xs">${task.priority}</span></td>
            <td class="p-3 whitespace-nowrap">
              <button onclick="deleteTask(${task.id})" class="text-rose-500 hover:text-rose-700 text-xs font-medium">ลบ</button>
            </td>
          </tr>
        `;
      });
    }

    // 2. บันทึก Task ใหม่
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newTask = {
        date: new Date().toISOString().split('T')[0],
        title: document.getElementById('title').value,
        reporter: document.getElementById('reporter').value,
        assignee: document.getElementById('assignee').value,
        category: document.getElementById('category').value,
        priority: document.getElementById('priority').value,
        status: 'Completed',
        description: document.getElementById('description').value
      };

      const { error } = await supabaseClient.from('tasks').insert([newTask]);

      if (error) {
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล (อย่าลืมรัน SQL คำสั่งเพิ่มคอลัมน์ reporter และ assignee บน Supabase ครับ)');
        console.error(error);
      } else {
        e.target.reset();
        fetchTasks();
      }
    });

    // 3. ลบ Task
    async function deleteTask(id) {
      if (confirm('คุณต้องการลบ Task นี้ใช่หรือไม่?')) {
        const { error } = await supabaseClient.from('tasks').delete().eq('id', id);
        if (error) {
          alert('ไม่สามารถลบข้อมูลได้');
        } else {
          fetchTasks();
        }
      }
    }

    // 4. Export ข้อมูลเป็น Excel (ตามที่แสดงในหน้าจอปัจจุบัน)
    function exportToExcel() {
      if (currentTasks.length === 0) {
        alert('ไม่มีข้อมูลสำหรับ Export');
        return;
      }

      const dataToExport = currentTasks.map((t, i) => ({
        'No.': i + 1,
        'Date': t.date,
        'Task Name': t.title,
        'Reporter / Dept': t.reporter || '-',
        'Assignee': t.assignee || '-',
        'Category': t.category,
        'Priority': t.priority,
        'Status': t.status,
        'Description / Outcome': t.description || '-'
      }));

      const worksheet = XLSX.utils.json_to_sheet(dataToExport);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "IT Task Log");

      worksheet['!cols'] = [
        { wch: 6 },  { wch: 12 }, { wch: 30 }, 
        { wch: 18 }, { wch: 16 }, { wch: 16 }, 
        { wch: 12 }, { wch: 12 }, { wch: 40 }
      ];

      XLSX.writeFile(workbook, `IT_Task_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    fetchTasks();
  </script>
</body>
</html>
